schema_version: "1"
logical_identities:
  customer_identity:
    name: Customer identity
nodes:
  - node_id: dataset_a
    descriptor:
      qualified_name: example.main.dataset_a
      display_name: Dataset A
    accessor:
      kind: sqlite
      endpoint: /srv/sqlite/example.sqlite
      properties:
        host: localhost
        schema: main
        object: dataset_a
    grain: unknown
    columns:
      - name: c1
      - name: c2
    entity_definitions:
      - identity_id: customer_identity
        # Invalid: dataset columns must use ascending exact-name order.
        dataset_columns: [c2, c1]
        entity_universe: unknown
        unique: unknown
        total: unknown
        conforms: unknown
