schema_version: "2"
logical_identities:
  customer_identity:
    name: Customer identity
nodes:
  - node_id: dataset_a
    descriptor:
      qualified_name: example.main.dataset_a
      display_name: Dataset A
      description: Customer identity source
      synonyms: [customer source]
      tags: [customer]
    accessor:
      schema_id: accessor.sqlite.v1
      properties:
        path: example.sqlite
        object: dataset_a
        format: sqlite
    grain:
      components:
        - identity_id: customer_identity
          dataset_columns: [c1, c2, c3]
    columns:
      - name: c1
      - name: c2
      - name: c3
    entity_definitions:
      - identity_id: customer_identity
        dataset_columns: [c1, c2, c3]
        is_entity_universe: false
        entity_expression:
          - "[c1, xxhash64(c2, c3)]"
        entity_metadata:
          expression_context: Spark SQL
  - node_id: dataset_b
    descriptor:
      qualified_name: s3://example/dataset-b/
      display_name: Dataset B
    accessor:
      schema_id: accessor.s3.v1
      properties:
        bucket: example
        prefix: dataset-b/
        format: parquet
    columns:
      - name: d1
      - name: d2
    entity_definitions:
      - identity_id: customer_identity
        dataset_columns: [d1, d2]
        is_entity_universe: true
        entity_expression:
          - "[d1, d2]"
edges:
  - endpoint_a:
      node_id: dataset_a
      identity_id: customer_identity
      dataset_columns: [c1, c2, c3]
    endpoint_b:
      node_id: dataset_b
      identity_id: customer_identity
      dataset_columns: [d1, d2]
    a_to_b:
      multiplicity: "many:1"
      match_existence: always
    b_to_a:
      multiplicity: "1:many"
      match_existence: optional
