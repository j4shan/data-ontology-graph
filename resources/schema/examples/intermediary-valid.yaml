schema_version: "1"
logical_identities:
  customer_identity:
    name: Customer identity
    description: Unknown
entity_relationships:
  - endpoints: [customer_identity, customer_identity]
    multiplicity: unknown
    match_existence: [optional, optional]
    descriptions:
      - A customer may refer another customer.
nodes:
  - node_id: dataset_a
    descriptor:
      qualified_name: example.main.dataset_a
      display_name: Dataset A
      description: Customer identity source
      synonyms: [customer source]
      tags: [customer]
    accessor:
      kind: sqlite
      endpoint: /srv/sqlite/example.sqlite
      properties:
        host: localhost
        schema: main
        object: dataset_a
    grain:
      components:
        - identity_id: customer_identity
          dataset_columns: [c1, c2, c3]
    columns:
      - name: c1
      - name: c2
      - name: c3
        description: N/A
    entity_definitions:
      - identity_id: customer_identity
        dataset_columns: [c1, c2, c3]
        entity_universe: partial
        unique: true
        total: unknown
        conforms: true
        entity_expression:
          - "[c1, xxhash64(c2, c3)]"
        entity_metadata:
          expression_context: Spark SQL
  - node_id: dataset_b
    descriptor:
      qualified_name: s3://example/dataset-b/
      display_name: Dataset B
    accessor:
      kind: s3
      endpoint: s3://example/dataset-b/
      properties:
        format: parquet
    grain: unknown
    columns:
      - name: d1
      - name: d2
    entity_definitions:
      - identity_id: customer_identity
        dataset_columns: [d1, d2]
        entity_universe: complete
        unique: true
        total: true
        conforms: true
        entity_expression:
          - "[d1, d2]"
