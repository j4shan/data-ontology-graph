schema_version: '2'
logical_identities:
  account_identity:
    name: Account identity
    description: Identifies a bank account.
  card_identity:
    name: Card identity
    description: Identifies a credit card.
  client_identity:
    name: Client identity
    description: Identifies a banking client.
  disposition_identity:
    name: Disposition identity
    description: Identifies a client-account disposition.
  district_identity:
    name: District identity
    description: Identifies a geographic district.
  loan_identity:
    name: Loan identity
    description: Identifies a loan contract.
  order_identity:
    name: Order identity
    description: Identifies a standing payment order.
  transaction_identity:
    name: Transaction identity
    description: Identifies an account transaction.
nodes:
- node_id: sql_db:financial.account
  descriptor:
    qualified_name: financial.main.account
    display_name: account
    description: Financial catalog account dataset.
    synonyms:
    - accounts
    - bank account
    tags: []
  accessor:
    schema_id: accessor.sqlite.v1
    properties:
      path: resources/data/dev_databases/financial/financial.sqlite
      object: account
      format: sqlite
  grain:
    components:
    - identity_id: account_identity
      dataset_columns:
      - account_id
  columns:
  - name: account_id
    description: the id of the account
    synonyms:
    - account id
  - name: district_id
    description: location of branch
    synonyms:
    - location of branch
  - name: frequency
    description: frequency of the acount
    value_description: '"POPLATEK MESICNE" stands for monthly issuance

      "POPLATEK TYDNE" stands for weekly issuance

      "POPLATEK PO OBRATU" stands for issuance after transaction'
  - name: date
    description: the creation date of the account
    value_description: in the form YYMMDD
  entity_definitions:
  - identity_id: account_identity
    dataset_columns:
    - account_id
    entity_expression:
    - '[account_id]'
    entity_metadata:
      expression_context: SQLite column reference
    is_entity_universe: false
  - identity_id: district_identity
    dataset_columns:
    - district_id
    entity_expression:
    - '[district_id]'
    entity_metadata:
      expression_context: SQLite column reference
    is_entity_universe: false
