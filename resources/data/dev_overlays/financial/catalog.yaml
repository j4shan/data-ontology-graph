    is_entity_universe: false
- node_id: sql_db:financial.trans
  descriptor:
    qualified_name: financial.main.trans
    display_name: trans
    description: Financial catalog trans dataset.
    synonyms:
    - transaction
    - transactions
    tags: []
  accessor:
    schema_id: accessor.sqlite.v1
    properties:
      path: resources/data/dev_databases/financial/financial.sqlite
      object: trans
      format: sqlite
  grain:
    components:
    - identity_id: transaction_identity
      dataset_columns:
      - trans_id
  columns:
  - name: trans_id
    description: transaction id
    synonyms:
    - transaction id
  - name: account_id
    description: account id
  - name: date
    description: date of transaction
    synonyms:
    - date of transaction
  - name: type
    description: +/- transaction
    value_description: '"PRIJEM" stands for credit

      "VYDAJ" stands for withdrawal'
    synonyms:
    - +/- transaction
  - name: operation
    description: mode of transaction
    value_description: '"VYBER KARTOU": credit card withdrawal

      "VKLAD": credit in cash

      "PREVOD Z UCTU" :collection from another bank

      "VYBER": withdrawal in cash

      "PREVOD NA UCET": remittance to another bank'
    synonyms:
    - mode of transaction
  - name: amount
    description: amount of money
    value_description: Unit：USD
    synonyms:
    - amount of money
  - name: balance
    description: balance after transaction
    value_description: Unit：USD
    synonyms:
    - balance after transaction
  - name: k_symbol
    description: characterization of the transaction
    value_description: '"POJISTNE": stands for insurrance payment

      "SLUZBY": stands for payment for statement

      "UROK": stands for interest credited

      "SANKC. UROK": sanction interest if negative balance

      "SIPO": stands for household

      "DUCHOD": stands for old-age pension

      "UVER": stands for loan payment'
    synonyms:
    - characterization of the transaction
  - name: bank
    description: bank of the partner
    value_description: each bank has unique two-letter code
    synonyms:
    - bank of the partner
  - name: account
    description: account of the partner
    synonyms:
    - account of the partner
  entity_definitions:
  - identity_id: account_identity
    dataset_columns:
    - account_id
    entity_expression:
    - '[account_id]'
    entity_metadata:
      expression_context: SQLite column reference
    is_entity_universe: false
  - identity_id: transaction_identity
    dataset_columns:
    - trans_id
    entity_expression:
    - '[trans_id]'
    entity_metadata:
      expression_context: SQLite column reference
    is_entity_universe: false
