- node_id: sql_db:financial.loan
  descriptor:
    qualified_name: financial.main.loan
    display_name: loan
    description: Financial catalog loan dataset.
    synonyms: []
    tags: []
  accessor:
    schema_id: accessor.sqlite.v1
    properties:
      path: resources/data/dev_databases/financial/financial.sqlite
      object: loan
      format: sqlite
  grain:
    components:
    - identity_id: loan_identity
      dataset_columns:
      - loan_id
  columns:
  - name: loan_id
    description: the id number identifying the loan data
  - name: account_id
    description: the id number identifying the account
  - name: date
    description: the date when the loan is approved
  - name: amount
    description: approved amount
    value_description: unit：US dollar
  - name: duration
    description: loan duration
    value_description: unit：month
  - name: payments
    description: monthly payments
    value_description: unit：month
    synonyms:
    - monthly payments
  - name: status
    description: repayment status
    value_description: '''A'' stands for contract finished, no problems;

      ''B'' stands for contract finished, loan not paid;

      ''C'' stands for running contract, OK so far;

      ''D'' stands for running contract, client in debt'
  entity_definitions:
  - identity_id: account_identity
    dataset_columns:
    - account_id
    entity_expression:
    - '[account_id]'
    entity_metadata:
      expression_context: SQLite column reference
    is_entity_universe: false
  - identity_id: loan_identity
    dataset_columns:
    - loan_id
    entity_expression:
    - '[loan_id]'
    entity_metadata:
      expression_context: SQLite column reference
    is_entity_universe: false
- node_id: sql_db:financial.order
  descriptor:
    qualified_name: financial.main.order
    display_name: order
    description: Financial catalog order dataset.
    synonyms: []
    tags: []
  accessor:
    schema_id: accessor.sqlite.v1
    properties:
      path: resources/data/dev_databases/financial/financial.sqlite
      object: order
      format: sqlite
  grain:
    components:
    - identity_id: order_identity
      dataset_columns:
      - order_id
  columns:
  - name: order_id
    description: identifying the unique order
  - name: account_id
    description: id number of account
  - name: bank_to
    description: bank of the recipient
    synonyms:
    - bank of the recipient
  - name: account_to
    description: account of the recipient
    value_description: each bank has unique two-letter code
    synonyms:
    - account of the recipient
  - name: amount
    description: debited amount
    synonyms:
    - debited amount
  - name: k_symbol
    description: purpose of the payment
    value_description: '"POJISTNE" stands for insurance payment

      "SIPO" stands for household payment

      "LEASING" stands for leasing

      "UVER" stands for loan payment'
    synonyms:
    - characterization of the payment
  entity_definitions:
  - identity_id: account_identity
    dataset_columns:
    - account_id
    entity_expression:
    - '[account_id]'
    entity_metadata:
      expression_context: SQLite column reference
    is_entity_universe: false
  - identity_id: order_identity
