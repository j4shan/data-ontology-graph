[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-ontology-graph"
version = "0.1.0"
description = "Local ontology graph service for entity and relationship evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marisa-trie>=1.4,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
data-ontology-graph-server = "data_ontology_graph.rpc.server:main"
data-ontology-graph-client = "data_ontology_graph.rpc.client:main"
data-ontology-graph-launchd = "data_ontology_graph.rpc.launchd:main"
data-ontology-graph-publish = "data_ontology_graph.builder.publish:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
