        - clients
        tags: []
      accessor:
        schema_id: accessor.sqlite.v1
        properties:
          host: localhost
          database_path: /srv/fixtures/lending.sqlite
          schema: main
          object: customer
      grain:
        components:
        - identity_id: customer_identity
          dataset_columns:
          - customer_id
      columns:
      - name: customer_id
        description: the id of the customer
        synonyms:
        - customer id
      - name: region_id
        description: home region of the customer
      - name: segment
        description: customer segment
        value_description: '"R" stands for retail'
      entity_definitions:
      - identity_id: customer_identity
        dataset_columns:
        - customer_id
        entity_expression:
        - '[customer_id]'
        entity_metadata:
          expression_context: SQLite column reference
        entity_universe: unknown
      - identity_id: region_identity
        dataset_columns:
        - region_id
        entity_expression:
        - '[region_id]'
        entity_metadata:
          expression_context: SQLite column reference
        entity_universe: unknown
    - node_id: sqlite:lending.region
      descriptor:
        qualified_name: lending.main.region
        display_name: region
        description: Lending fixture region dataset.
        synonyms:
        - regions
        tags: []
      accessor:
        schema_id: accessor.sqlite.v1
        properties:
          host: localhost
          database_path: /srv/fixtures/lending.sqlite
          schema: main
          object: region
      grain:
        components:
        - identity_id: region_identity
          dataset_columns:
          - region_id
      columns:
      - name: region_id
        description: the id of the region
      - name: region_name
        description: the region name
      entity_definitions:
      - identity_id: region_identity
        dataset_columns:
        - region_id
        entity_expression:
        - '[region_id]'
        entity_metadata:
          expression_context: SQLite column reference
        entity_universe: complete
    edges:
    - endpoint_a:
        node_id: sqlite:lending.customer
        identity_id: region_identity
        dataset_columns:
        - region_id
      endpoint_b:
        node_id: sqlite:lending.region
        identity_id: region_identity
        dataset_columns:
