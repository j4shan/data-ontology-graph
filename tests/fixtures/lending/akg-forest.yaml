# Lending AKG fixture: a question about disjoint facts, resolved by two cuts
# Generated from catalog.yaml; nodes and edges are copied verbatim.
akg_version: '1.0'
question: List each loan with its repayment account, and separately list customers
  with their home region.
snapshot:
  version: '5.0'
  schema_fingerprint: 3f0b8c99b8579402
akgs:
- interpretation: 'Two disjoint facts: loans by repayment account, and customers by
    home region.'
  cuts:
  - logical_identities:
      account_identity:
        name: Account identity
        description: Identifies a deposit account.
    nodes:
    - node_id: sqlite:lending.loan
      descriptor:
        qualified_name: lending.main.loan
        display_name: loan
        description: Lending fixture loan dataset.
        synonyms:
        - loans
        tags: []
      accessor:
        schema_id: accessor.sqlite.v1
        properties:
          host: localhost
          database_path: /srv/fixtures/lending.sqlite
          schema: main
          object: loan
      grain:
        components:
        - identity_id: loan_identity
          dataset_columns:
          - loan_id
      columns:
      - name: loan_id
        description: the id of the loan
      - name: account_id
        description: the account that repays the loan
      - name: amount
        description: approved loan amount
      - name: term
        description: repayment term
        value_description: 'unit: month'
      entity_definitions:
      - identity_id: loan_identity
        dataset_columns:
        - loan_id
        entity_expression:
        - '[loan_id]'
        entity_metadata:
          expression_context: SQLite column reference
        entity_universe: unknown
      - identity_id: account_identity
        dataset_columns:
        - account_id
        entity_expression:
        - '[account_id]'
        entity_metadata:
          expression_context: SQLite column reference
        entity_universe: unknown
    - node_id: sqlite:lending.account
      descriptor:
        qualified_name: lending.main.account
        display_name: account
        description: Lending fixture account dataset.
        synonyms:
        - accounts
        - deposit account
        tags: []
      accessor:
        schema_id: accessor.sqlite.v1
        properties:
          host: localhost
          database_path: /srv/fixtures/lending.sqlite
          schema: main
          object: account
      grain:
        components:
        - identity_id: account_identity
          dataset_columns:
          - account_id
      columns:
      - name: account_id
        description: the id of the account
        synonyms:
        - account id
      - name: region_id
        description: region of the opening branch
        synonyms:
        - opening region
      - name: statement_cycle
        description: how often statements are issued
        value_description: '"M" stands for monthly statements

          "Q" stands for quarterly statements'
      - name: opened_on
        description: the date the account was opened
        value_description: in the form YYYY-MM-DD
      entity_definitions:
      - identity_id: account_identity
        dataset_columns:
        - account_id
        entity_expression:
        - '[account_id]'
        entity_metadata:
          expression_context: SQLite column reference
        entity_universe: unknown
      - identity_id: region_identity
        dataset_columns:
        - region_id
        entity_expression:
        - '[region_id]'
        entity_metadata:
          expression_context: SQLite column reference
        entity_universe: unknown
    edges:
    - endpoint_a:
        node_id: sqlite:lending.loan
        identity_id: account_identity
        dataset_columns:
        - account_id
      endpoint_b:
        node_id: sqlite:lending.account
        identity_id: account_identity
        dataset_columns:
        - account_id
      a_to_b:
        multiplicity: many:1
        match_existence: always
      b_to_a:
        multiplicity: 1:many
        match_existence: optional
  - logical_identities:
      region_identity:
        name: Region identity
        description: Identifies a service region.
    nodes:
    - node_id: sqlite:lending.customer
      descriptor:
        qualified_name: lending.main.customer
        display_name: customer
        description: Lending fixture customer dataset.
        synonyms:
