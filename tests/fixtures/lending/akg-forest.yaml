        match_existence: optional
  reasoning:
    anchors:
    - sqlite:lending.loan
    - sqlite:lending.customer
    attributes:
    - node_id: sqlite:lending.loan
      column: loan_id
      usage: output
    - node_id: sqlite:lending.account
      column: account_id
      usage: output
    - node_id: sqlite:lending.customer
      column: customer_id
      usage: output
    - node_id: sqlite:lending.region
      column: region_name
      usage: output
