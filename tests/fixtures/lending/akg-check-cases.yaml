# Lending AKG check cases: one rule per case.
# Each case changes a valid fixture at a key path (a list of keys and list indexes): delete a
# value, set a value, or rename a map key. `final: true` checks with the finalize rules.
cases:
- case: missing question
  base: akg-single.json
  expected: missing
  severity: error
  delete: [question]
- case: datasets written as a list
  base: akg-single.json
  expected: dict_type
  severity: error
  set:
    path: [datasets]
    value: []
- case: missing format version
  base: akg-single.json
  expected: missing
  severity: error
  delete: [format_version]
- case: earlier relationships map
  base: akg-single.json
  expected: unconverted_relationships
  severity: error
  set:
    path: [relationships]
    value: {}
- case: unknown match_existence
  base: akg-single.json
  expected: enum
  severity: error
  set:
    path: [datasets, "sqlite:lending.loan", edges, 0, match_existence]
    value: sometimes
- case: unknown column usage
  base: akg-single.json
  expected: literal_error
  severity: error
  set:
    path: [datasets, "sqlite:lending.loan", usage, columns, loan_id, as]
    value: sum
- case: edge ID is not the canonical ID of its entity definitions
  base: akg-single.json
  expected: edge_key
  severity: error
  set:
    path: [datasets, "sqlite:lending.loan", edges, 0, edge_id]
    value: "sqlite:lending.loan:account_identity:account_id__sqlite:lending.account:account_identity:account_id"
- case: keep names neither end of the directed edge
  base: akg-single.json
  expected: not_an_endpoint
  severity: error
  set:
    path: [datasets, "sqlite:lending.loan", edges, 0, usage, keep]
    value: [sqlite:lending.region]
- case: dangling end in a draft
  base: akg-disjoint.json
  expected: dangling_reference
  severity: warning
  delete: [datasets, "sqlite:lending.region"]
- case: dangling end at finalize
  base: akg-disjoint.json
  expected: dangling_reference
  severity: error
  final: true
  delete: [datasets, "sqlite:lending.region"]
- case: usage column not listed
  base: akg-single.json
  expected: unlisted_column
  severity: warning
  delete: [datasets, "sqlite:lending.loan", columns, loan_id]
- case: gap names an absent dataset
  base: akg-single.json
  expected: dangling_reference
  severity: warning
  set:
    path: [gaps, region-match, datasets]
    value: [sqlite:lending.branch]
- case: gap names an absent directed edge
  base: akg-single.json
  expected: dangling_reference
  severity: warning
  set:
    path: [gaps, region-match, edges]
    value: [{node_id: sqlite:lending.region, edge_id: "sqlite:lending.account:region_identity:region_id__sqlite:lending.region:region_identity:region_id"}]
- case: unknown key
  base: akg-single.json
  expected: unknown_key
  severity: info
  set:
    path: [datasets, "sqlite:lending.loan", row_count]
    value: 10
