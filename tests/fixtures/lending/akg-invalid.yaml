# Lending AKG fixture: one contract violation per case.
# Each case applies one change to a valid fixture: delete, set, or append a value at a
# dotted path ("from" copies an existing value), or copy one path over another.
cases:
- case: missing envelope field
  base: akg-one-cut.yaml
  expected: missing
  delete: question
- case: node field outside the graph model
  base: akg-one-cut.yaml
  expected: extra_forbidden
  set:
    path: akgs.0.cuts.0.nodes.0.row_count
    value: 10
- case: unknown attribute usage
  base: akg-one-cut.yaml
  expected: literal_error
  set:
    path: akgs.0.reasoning.attributes.0.usage
    value: sum
- case: empty akgs list
  base: akg-one-cut.yaml
  expected: too_short
  set:
    path: akgs
    value: []
- case: edge joins two cuts
  base: akg-forest.yaml
  expected: value_error
  append:
    path: akgs.0.cuts.0.edges
    value:
      endpoint_a:
        node_id: sqlite:lending.customer
        identity_id: region_identity
        dataset_columns:
        - region_id
      endpoint_b:
        node_id: sqlite:lending.region
        identity_id: region_identity
        dataset_columns:
        - region_id
      a_to_b:
        multiplicity: many:1
        match_existence: always
      b_to_a:
        multiplicity: 1:many
        match_existence: optional
- case: node in two cuts
  base: akg-forest.yaml
  expected: value_error
  copy:
    from: akgs.0.cuts.0
    to: akgs.0.cuts.1
- case: cut not connected through its own edges
  base: akg-data-gap.yaml
  expected: value_error
  append:
    path: akgs.0.cuts.0.nodes
    from: akgs.0.cuts.1.nodes.0
- case: reasoning names a node outside every cut
  base: akg-one-cut.yaml
  expected: value_error
  set:
    path: akgs.0.reasoning.anchors
    value:
    - sqlite:lending.customer
