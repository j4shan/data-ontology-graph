# Synthetic `open_accessor` catalog for graph unit tests. Every identifier here belongs to
# this catalog only; it describes no real data source. Each dataset's accessor is a path of
# information written in the contributor's own words (product/graph-model.md 2.6).
schema_version: '5'
logical_identities:
  customer_identity:
    name: Customer identity
    description: Identifies a customer across regions.
  order_identity:
    name: Order identity
    description: Identifies a sales order.
nodes:
- node_id: dbx-emea:finance.gl.journal_line
  descriptor:
    qualified_name: finance.gl.journal_line
    display_name: journal_line
    description: General-ledger journal lines for EMEA.
  accessor:
    kind: databricks
    endpoint: https://adb-4021.7.azuredatabricks.net
    labels:
      region: emea
    properties:
      catalog: finance
      schema: gl
      table: journal_line
  grain: unknown
  columns:
  - name: journal_line_id
  - name: order_id
  entity_definitions:
  - identity_id: order_identity
    dataset_columns:
    - order_id
    entity_universe: partial
    unique: false
    total: false
    conforms: unknown
- node_id: sf-amer:SALES.CORE.ORDERS
  descriptor:
    qualified_name: SALES.CORE.ORDERS
    display_name: ORDERS
    description: Sales orders for the Americas.
  accessor:
    kind: snowflake
    endpoint: acme-amer_sales
    labels:
      region: amer
    properties:
      database: SALES
      schema: CORE
      table: ORDERS
  grain:
    components:
    - identity_id: order_identity
      dataset_columns:
      - ORDER_ID
  columns:
  - name: ORDER_ID
  - name: CUSTOMER_ID
  entity_definitions:
  - identity_id: order_identity
    dataset_columns:
    - ORDER_ID
    entity_universe: partial
    unique: true
    total: true
    conforms: true
  - identity_id: customer_identity
    dataset_columns:
    - CUSTOMER_ID
    entity_universe: partial
    unique: false
    total: true
    conforms: unknown
